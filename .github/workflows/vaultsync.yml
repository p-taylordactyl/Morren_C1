name: Sync Vault to Quartz

on:
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Morren_C1
        uses: actions/checkout@v7

      - name: Checkout hoodswatch
        uses: actions/checkout@v7
        with:
          repository: p-taylordactyl/hoodswatch
          token: ${{ secrets.ghp_dinktay }}
          path: hoodswatch

      - name: Clear Outdated Content
        run: |
          rm -rf hoodswatch/content
          mkdir -p hoodswatch/content
      
      - name: Copy files to Hoods Watch
        run: |
          rsync -av \
            --exclude=".git" \
            --exclude=".github" \
            ./ hoodswatch/content/
          
      - name: Commit and push changes
        run: |
          cd p-taylordactyl/hoodswatch

          git config user.name "p-taylordactyl"
          git config user.email "279896963+p-taylordactyl@users.noreply.github.com"

          git add .

          git commit -m "Sync from Vault Repo"
          git push origin v5
          

